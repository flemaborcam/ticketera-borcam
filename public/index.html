<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Borcam — Sistema de Tickets</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F2A4D">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Borcam Tickets">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A4D; --ink-soft:#48607F; --paper:#F3F7FC; --card:#FFFFFF;
    --line:#DCE7F5; --line-strong:#B7CDE8; --brand:#1E56C7; --brand-2:#3D7EF0; --brand-tint:#E7F0FE;
    --stamp-red:#C43D3D; --stamp-red-tint:#FBE7E7; --stamp-amber:#B3811C; --stamp-amber-tint:#F5EAD4;
    --stamp-green:#1F8A5F; --stamp-green-tint:#E1F5EC; --gray:#7488A3; --gray-tint:#EAF1FA;
    --radius:8px; --shadow:0 1px 2px rgba(15,42,77,.07),0 2px 6px rgba(15,42,77,.05);
    --font-display:'Oswald',sans-serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  img{max-width:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;font-size:15px;} a{color:var(--brand);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius);border:1px solid transparent;font-weight:600;font-size:14px;transition:.15s ease;}
  .btn-primary{background:var(--brand);color:#fff;} .btn-primary:hover{background:#26404F;}
  .btn-ghost{background:transparent;color:var(--brand);border-color:var(--line-strong);} .btn-ghost:hover{background:var(--brand-tint);}
  .btn-danger{background:transparent;color:var(--stamp-red);border-color:var(--stamp-red-tint);} .btn-danger:hover{background:var(--stamp-red-tint);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4;cursor:default;pointer-events:none;}
  .field{margin-bottom:14px;} .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:90px;} .field-row{display:flex;gap:12px;} .field-row .field{flex:1;}
  .error-text{color:var(--stamp-red);font-size:13px;margin:-6px 0 12px;} .hint-text{color:var(--ink-soft);font-size:12.5px;margin-top:4px;}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:0;overflow:hidden;}
  .auth-card-brand{background:var(--ink);padding:22px 28px;display:flex;justify-content:center;align-items:center;}
  .auth-card-brand img{height:36px;width:auto;max-width:100%;display:block;}
  .auth-card-body{padding:32px 28px;}

  .auth-card h1{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0 0 4px;} .auth-card .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}
  .auth-toggle{text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink-soft);} .auth-toggle button{background:none;border:none;color:var(--brand);font-weight:600;padding:0;font-size:13.5px;}
  .demo-note{margin-top:18px;padding:10px 12px;background:var(--brand-tint);border-radius:var(--radius);font-size:12.5px;color:var(--brand);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex:none;background:var(--ink);color:#EDEFEC;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
  .brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand-mark .logo-img{height:36px;width:auto;display:block;object-fit:contain;}
  .brand-mark .name{font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.03em;text-transform:uppercase;}
  .sidebar .brand-mark .name{color:#CDE0FA;} .sidebar nav{margin-top:20px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:none;border:none;color:#B9CDEC;font-size:14px;font-weight:500;text-align:left;}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;} .nav-btn.active{background:var(--brand);color:#fff;} .nav-btn .ico{width:18px;text-align:center;flex:none;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:10px;}
  .who{font-size:12.5px;color:#8FAAD4;padding:0 12px 8px;} .who strong{display:block;color:#fff;font-size:13.5px;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:none;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;}
  .content{padding:26px 30px 90px;max-width:1000px;width:100%;margin:0 auto;}
  .page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .page-head h1{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0;} .page-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:3px;}
  .page-head-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .bottomnav{display:none;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .filters select,.filters input[type=search],.filters input[type=date]{padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:#fff;font-size:13.5px;color:var(--ink);}
  .filters .btn{padding:8px 14px;font-size:13.5px;}
  .filters input[type=search]{flex:1;min-width:160px;}
  .mes-picker,.fecha-picker{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid #bcd0f5;border-radius:20px;background:linear-gradient(180deg,#ffffff 0%,var(--brand-tint) 100%);box-shadow:0 2px 0 #bcd0f5,0 4px 8px rgba(30,86,199,.15),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .1s,box-shadow .1s,background .15s;cursor:pointer;}
  .mes-picker:hover,.fecha-picker:hover{background:linear-gradient(180deg,#ffffff 0%,#dbe8fd 100%);}
  .mes-picker:active,.fecha-picker:active{transform:translateY(2px);box-shadow:0 0 0 #bcd0f5,0 1px 2px rgba(30,86,199,.15),inset 0 1px 0 rgba(255,255,255,.8);}
  .mes-picker:focus-within,.fecha-picker:focus-within{border-color:var(--brand);}
  .mes-picker .mes-icon,.fecha-picker .mes-icon{font-size:14px;line-height:1;}
  .input-mes,.input-fecha{border:none;background:transparent;color:var(--brand);font-size:13.5px;font-weight:600;cursor:pointer;padding:0;}
  /* Dentro de una barra de filtros (junto a selects y al botón "Tickets de hoy"), el picker de
     fecha se ve como uno más del grupo: blanco, borde fino, mismo alto — no como un botón aparte. */
  .filters .fecha-picker{padding:0;border:none;border-radius:0;background:transparent;box-shadow:none;gap:6px;}
  .filters .fecha-picker:hover{background:transparent;}
  .filters .fecha-picker:active{transform:none;box-shadow:none;}
  .filters .fecha-picker .mes-icon{font-size:15px;opacity:.65;}
  .filters .input-fecha{color:var(--ink);font-weight:400;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:#fff;}
  .input-mes:focus,.input-fecha:focus{outline:none;}
  .input-mes::-webkit-calendar-picker-indicator,.input-fecha::-webkit-calendar-picker-indicator{filter:invert(28%) sepia(84%) saturate(1400%) hue-rotate(203deg);opacity:.85;cursor:pointer;}
  .stub-list{display:flex;flex-direction:column;gap:12px;}
  .stub{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);text-align:left;width:100%;padding:0;cursor:pointer;}
  /* Franja de color a la izquierda de cada ticket según su prioridad, para poder escanear la
     bandeja de un vistazo sin tener que leer la etiqueta de texto. */
  .stub[data-prioridad="urgente"]{border-left-color:var(--stamp-red);}
  .stub[data-prioridad="alta"]{border-left-color:var(--stamp-amber);}
  .stub[data-prioridad="media"]{border-left-color:var(--brand-2);}
  .stub[data-prioridad="baja"]{border-left-color:var(--gray);}
  .stub:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;}
  .stub-check{display:flex;align-items:center;padding:0 4px 0 14px;flex:none;cursor:pointer;}
  .stub-check input{width:17px;height:17px;cursor:pointer;accent-color:var(--brand);}
  .stub:hover{border-color:var(--line-strong);}
  .stub-num{flex:none;width:96px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);position:relative;border-right:2px dashed rgba(255,255,255,.35);padding:10px 6px;}
  .stub-num::before,.stub-num::after{content:"";position:absolute;width:14px;height:14px;background:var(--paper);border-radius:50%;right:-8px;} .stub-num::before{top:-7px;} .stub-num::after{bottom:-7px;}
  .stub-num .n{font-size:15px;font-weight:600;} .stub-num .y{font-size:10px;opacity:.7;margin-top:2px;font-family:var(--font-mono);}
  .stub-body{flex:1;min-width:0;padding:12px 16px;display:flex;flex-direction:column;gap:6px;}
  .stub-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .stub-asunto{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .stub-time{font-family:var(--font-mono);font-size:11.5px;color:var(--gray);flex:none;}
  .stub-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;} .stub-remitente{font-size:12.5px;color:var(--ink-soft);} .stub-snippet{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;}
  .tag-cat{background:var(--gray-tint);color:var(--ink-soft);} .tag-cliente{background:var(--brand-tint);color:var(--brand-2);} .tag-agente{background:var(--gray-tint);color:var(--ink-soft);}
  .tag-baja{background:var(--gray-tint);color:var(--gray);} .tag-media{background:var(--brand-tint);color:var(--brand);} .tag-alta{background:var(--stamp-amber-tint);color:var(--stamp-amber);} .tag-urgente{background:var(--stamp-red-tint);color:var(--stamp-red);}
  .tag-abierto{background:var(--brand-tint);color:var(--brand);} .tag-en-progreso{background:var(--stamp-amber-tint);color:var(--stamp-amber);} .tag-esperando-al-cliente{background:#F1E7F7;color:#7A4FA0;} .tag-resuelto{background:var(--stamp-green-tint);color:var(--stamp-green);} .tag-cerrado{background:var(--gray-tint);color:var(--ink-soft);}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state::before{content:'🗂️';display:block;font-size:38px;margin-bottom:14px;opacity:.55;filter:grayscale(.15);}
  .empty-state .big{font-family:var(--font-display);font-size:19px;color:var(--ink);margin-bottom:6px;}
  /* Estado de "cargando": en vez del ícono de carpeta vacía (que no aplica acá), un spinner girando. */
  .empty-state.cargando::before{content:'';width:30px;height:30px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--brand);animation:girar .7s linear infinite;opacity:1;filter:none;}
  @keyframes girar{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.empty-state.cargando::before{animation:none;}}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-bottom:14px;padding:0;} .back-link:hover{color:var(--brand);}
  .ticket-head{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);}
  .ticket-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .ticket-num-big{font-family:var(--font-mono);font-size:12.5px;color:var(--gray);} .ticket-head h1{font-family:var(--font-display);font-size:21px;font-weight:600;margin:4px 0 8px;} .ticket-from{font-size:13px;color:var(--ink-soft);}
  .stamp{font-family:var(--font-display);font-weight:600;font-size:13px;text-transform:uppercase;border:2px solid currentColor;border-radius:4px;padding:6px 14px;transform:rotate(-4deg);flex:none;}
  .stamp-abierto{color:var(--brand);} .stamp-en-progreso{color:var(--stamp-amber);} .stamp-esperando-al-cliente{color:#7A4FA0;} .stamp-resuelto{color:var(--stamp-green);} .stamp-cerrado{color:var(--gray);}
  .stamp-atencion{color:var(--stamp-red);}
  .badge-atencion{display:inline-flex;align-items:center;gap:5px;background:var(--stamp-red-tint);color:var(--stamp-red);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;padding:4px 9px;border-radius:5px;}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line-strong);} .meta-grid .field{margin-bottom:0;}
  .thread{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
  .msg{max-width:82%;border-radius:10px;padding:13px 15px;box-shadow:var(--shadow);}
  .msg-entrante{background:#fff;border:1px solid var(--line);align-self:flex-start;border-top-left-radius:2px;}
  .msg-saliente{background:var(--brand);color:#fff;align-self:flex-end;border-top-right-radius:2px;}
  .msg-sistema{background:var(--gray-tint);border:1px dashed var(--line-strong);align-self:center;text-align:center;color:var(--ink-soft);max-width:90%;} .msg-sistema .msg-head{justify-content:center;}
  .msg-nota{background:var(--stamp-amber-tint);border:1px solid #E8D28F;align-self:stretch;max-width:100%;}
  .msg-head{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;margin-bottom:6px;font-family:var(--font-mono);}
  .msg-entrante .msg-head{color:var(--gray);} .msg-saliente .msg-head{color:rgba(255,255,255,.75);}
  .msg-autor{font-weight:600;} .msg-body{font-size:14px;white-space:pre-wrap;line-height:1.55;}
  .msg-cc{font-size:11.5px;font-family:var(--font-mono);opacity:.75;margin-bottom:6px;} .msg-destinatarios{font-size:11px;margin-top:6px;opacity:.85;}
  .auto-badge{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;background:rgba(255,255,255,.25);padding:2px 7px;border-radius:99px;}
  .msg-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;} .msg-attachments img{max-width:180px;max-height:140px;border-radius:6px;object-fit:cover;}
  .msg-html-frame{display:block;width:100%;max-width:100%;height:480px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .attach-video{max-width:100%;max-height:220px;border-radius:6px;} .attach-file{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.06);padding:6px 10px;border-radius:6px;font-size:12.5px;text-decoration:none;color:inherit;}
  .attach-video-wrap{display:flex;flex-direction:column;gap:6px;}
  .msg-saliente .attach-file{background:rgba(255,255,255,.16);color:#fff;}
  .reply-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);}
  .reply-tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--gray-tint);padding:4px;border-radius:8px;width:fit-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .reply-tabs .reply-tab{flex:none;}
  .reply-tab{border:none;background:none;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);} .reply-tab.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  .reply-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow);} .card-narrow{max-width:480px;}
  .user-list{display:flex;flex-direction:column;gap:10px;} .user-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;font-family:var(--font-display);}
  .u-name{font-weight:600;font-size:14px;} .u-sub{font-size:12.5px;color:var(--ink-soft);} .cargo-pill{margin-left:auto;flex:none;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,24,27,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{background:#fff;border-radius:10px;max-width:480px;width:100%;padding:24px;max-height:88vh;overflow:auto;} .modal h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px;} .modal .sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60;}
  .sign-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;} .sign-toolbar .btn{padding:6px 11px;font-size:13px;min-width:34px;}
  .sign-editor{min-height:90px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px 12px;background:#fff;font-size:14px;line-height:1.5;} .sign-editor img{max-width:100%;margin-top:6px;border-radius:4px;}
  .paso-row{border:1px solid var(--line-strong);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--paper);}
  /* Para cualquier tabla ancha (columnas de números, acciones, etc.): en vez de que arrastre toda la
     página de costado en celular, se desplaza solo ella, tocando encima. */
  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .reportes-table{width:100%;border-collapse:collapse;font-size:13px;}
  .reportes-table th,.reportes-table td{padding:9px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;}
  .reportes-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  @media (max-width:880px){
    .sidebar{display:none;} .topbar{display:flex;} .content{padding:18px 16px 90px;}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;border-top:1px solid rgba(255,255,255,.08);}
    .bottomnav .nav-btn{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;align-items:center;border-radius:8px;} .bottomnav .nav-btn .ico{font-size:17px;}
    .msg{max-width:92%;}
    /* Formularios largos (nuevo turno, contrato de mantenimiento, etc.): en vez de una ventanita
       chica en el medio con el teclado tapando media pantalla, ocupan casi toda la pantalla desde
       abajo — más cómodo para escribir y ver lo que se va completando. */
    .modal-backdrop{padding:0;align-items:flex-end;}
    .modal{max-width:100%;width:100%;border-radius:16px 16px 0 0;max-height:94vh;padding:20px 16px;}
    /* Grupos de botones de encabezado (ej. "Importar" + "Nuevo cliente"): en vez de amontonarse en
       una fila angosta, se apilan uno debajo del otro ocupando todo el ancho. */
    .page-head-actions{width:100%;flex-direction:column;}
    .page-head-actions .btn{width:100%;}
    /* Modales con muchas acciones (ej. detalle de servicio técnico): en vez de amontonarse en
       una fila que corta botones fuera de pantalla, se apilan de a uno ocupando todo el ancho. */
    .modal-actions{flex-direction:column-reverse;width:100%;}
    .modal-actions .btn{width:100%;}
    /* Filtros (estado, categoría, prioridad, etc.): más grandes y fáciles de tocar, dos por fila
       en vez de una tira angosta de selects apretados. */
    .filters select,.filters input[type=date]{flex:1 1 46%;min-width:130px;padding:10px 12px;font-size:14px;}
    .filters input[type=search]{flex:1 1 100%;}
